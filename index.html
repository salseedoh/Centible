<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Centible</title>
  <!-- iOS Home Screen Icon -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Rest of your CSS / Supabase scripts -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Centible">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-24 font-sans antialiased">

  <!-- Header -->
  <header class="pt-12 pb-4 px-4 bg-slate-800/80 backdrop-blur sticky top-0 z-10 border-b border-slate-700/50 flex justify-between items-center max-w-md mx-auto">
    <h1 class="text-xl font-bold tracking-tight text-emerald-400">💎 Centible</h1>
    <div class="flex items-center gap-2">
      <button onclick="exportCSV()" class="text-xs bg-slate-700/60 hover:bg-slate-600 text-slate-300 px-2.5 py-1 rounded-full border border-slate-600" title="Export CSV">📥 Export</button>
      <button onclick="openAccountModal()" class="text-xs bg-slate-700 hover:bg-slate-600 active:scale-95 text-slate-200 px-3 py-1 rounded-full font-semibold transition border border-slate-600">⚙️ Accounts</button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-5">

    <!-- Date / Month Selector Navigation -->
    <div class="flex justify-between items-center bg-slate-800/50 p-2 rounded-xl border border-slate-700/50">
      <button onclick="changeMonth(-1)" class="p-1.5 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-white">&larr; Prev</button>
      <span class="text-sm font-bold text-slate-200" id="current-month-display"></span>
      <button onclick="changeMonth(1)" class="p-1.5 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-white">Next &rarr;</button>
    </div>

    <!-- Quick Presets -->
    <div class="space-y-1.5">
      <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Quick Shortcuts</p>
      <div class="grid grid-cols-4 gap-2 text-xs">
        <button onclick="quickPreset('paycheck')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-xl border border-slate-700 text-center font-medium">💵 Paycheck</button>
        <button onclick="quickPreset('groceries')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-xl border border-slate-700 text-center font-medium">🛒 Food</button>
        <button onclick="quickPreset('coffee')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-xl border border-slate-700 text-center font-medium">☕ Coffee</button>
        <button onclick="quickPreset('gas')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-xl border border-slate-700 text-center font-medium">⛽ Fuel</button>
      </div>
    </div>

    <!-- Net Worth Summary -->
    <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg">
      <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Estimated Net Worth</p>
      <h2 class="text-3xl font-extrabold mt-1 text-white" id="net-worth">$0.00</h2>
      <div class="grid grid-cols-2 gap-4 mt-4 pt-4 border-t border-slate-700/50 text-sm">
        <div>
          <span class="text-slate-400 block text-xs">Total Assets</span>
          <span class="font-semibold text-emerald-400" id="total-assets">$0.00</span>
        </div>
        <div>
          <span class="text-slate-400 block text-xs">Total Liabilities</span>
          <span class="font-semibold text-rose-400" id="total-liabilities">$0.00</span>
        </div>
      </div>
    </div>

    <!-- Quick Action Button -->
    <button onclick="openTxModal()" class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-slate-950 font-bold py-3.5 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
      New Transaction
    </button>

    <!-- Monthly Budget Overview -->
    <section>
      <h3 class="text-base font-bold mb-3 text-slate-200">Monthly Budget Status</h3>
      <div class="space-y-3" id="budget-list"></div>
    </section>

    <!-- Recent Transactions & Search -->
    <section>
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-base font-bold text-slate-200">Activity</h3>
        <input type="text" id="search-input" oninput="handleSearch()" placeholder="Search transactions..." class="bg-slate-800 border border-slate-700 text-xs text-white rounded-lg px-2.5 py-1 outline-none w-40 focus:ring-1 focus:ring-emerald-500">
      </div>
      <div class="bg-slate-800 rounded-2xl border border-slate-700 divide-y divide-slate-700/50" id="transaction-list"></div>
    </section>

  </main>

  <!-- Modal 1: New / Edit Transaction -->
  <div id="tx-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 border border-slate-700 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-bold" id="tx-modal-title">New Transaction</h3>
        <button onclick="closeTxModal()" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
      </div>

      <form id="tx-form" onsubmit="handleSaveTransaction(event)" class="space-y-4">
        <input type="hidden" id="tx-id">

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">From Account (Source)</label>
          <div class="relative">
            <input id="from-account" type="text" autocomplete="off" placeholder="Start typing an account name" required aria-controls="from-account-suggestions" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none focus:ring-2 focus:ring-emerald-500">
            <input id="from-account-id" type="hidden">
            <div id="from-account-suggestions" class="hidden absolute left-0 right-0 mt-1 max-h-48 overflow-y-auto rounded-xl border border-slate-600 bg-slate-800 shadow-xl z-50"></div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">To Account (Destination)</label>
          <div class="relative">
            <input id="to-account" type="text" autocomplete="off" placeholder="Start typing an account name" required aria-controls="to-account-suggestions" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none focus:ring-2 focus:ring-emerald-500">
            <input id="to-account-id" type="hidden">
            <div id="to-account-suggestions" class="hidden absolute left-0 right-0 mt-1 max-h-48 overflow-y-auto rounded-xl border border-slate-600 bg-slate-800 shadow-xl z-50"></div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Amount ($)</label>
            <input type="number" step="0.01" id="amount" placeholder="0.00" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Date</label>
            <input type="date" id="tx-date" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Notes (Optional)</label>
          <input type="text" id="tx-notes" placeholder="e.g. Target run, Monthly bonus" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" id="delete-tx-btn" onclick="handleDeleteTransaction()" class="hidden w-1/3 bg-rose-900/40 hover:bg-rose-800 text-rose-300 font-bold py-3.5 rounded-xl transition">Delete</button>
          <button type="submit" class="flex-1 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-slate-950 font-bold py-3.5 rounded-xl transition">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal 2: Manage Accounts & Budgets -->
  <div id="account-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 border border-slate-700 space-y-4 shadow-2xl max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-bold">Manage Accounts & Budgets</h3>
        <button onclick="closeAccountModal()" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
      </div>

      <form id="acc-form" onsubmit="handleSaveAccount(event)" class="bg-slate-900 p-4 rounded-xl space-y-3 border border-slate-700">
        <h4 class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Add New Account</h4>
        <div>
          <input type="text" id="acc-name" placeholder="Account Name (e.g. Dining, Savings)" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white outline-none">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <select id="acc-type" required class="bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white outline-none">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
            <option value="asset">Asset</option>
            <option value="liability">Liability</option>
          </select>
          <input type="number" step="0.01" id="acc-budget" placeholder="Monthly Target ($)" class="bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white outline-none">
        </div>
        <button type="submit" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2 rounded-lg text-sm transition">Add Account</button>
      </form>

      <div class="space-y-2">
        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Existing Accounts</h4>
        <div id="account-manage-list" class="divide-y divide-slate-700/50"></div>
      </div>
    </div>
  </div>

  <!-- Modal 3: Export Date Range -->
  <div id="export-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-slate-800 rounded-2xl p-6 w-full max-w-md border border-slate-700 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-100">Export to GnuCash</h3>
        <button onclick="closeExportModal()" class="text-slate-400 hover:text-slate-200 text-xl font-bold">&times;</button>
      </div>

      <form onsubmit="handleExportSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Start Date</label>
          <input type="date" id="export-start-date" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-200 text-sm focus:outline-none focus:border-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">End Date</label>
          <input type="date" id="export-end-date" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-200 text-sm focus:outline-none focus:border-emerald-500">
        </div>

        <div class="pt-2 flex justify-between gap-3">
          <button type="button" onclick="setExportPreset('all')" class="text-xs text-slate-400 hover:text-emerald-400 underline">Export All Time</button>
          <div class="flex gap-2">
            <button type="button" onclick="closeExportModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-semibold text-slate-300">Cancel</button>
            <button type="submit" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl text-xs shadow-lg shadow-emerald-500/20">Download CSV</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
  <!-- Login Modal -->
<div id="login-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
  <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-sm shadow-xl text-center">
    <div class="text-3xl mb-2">💎</div>
    <h2 class="text-xl font-bold text-slate-100 mb-1">Welcome to Centible</h2>
    <p class="text-xs text-slate-400 mb-6">Please sign in to access your finances.</p>
    
    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 text-left">
      <div>
        <label class="block text-xs text-slate-400 mb-1">Email</label>
        <input type="email" id="login-email" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-100 text-sm focus:outline-none focus:border-emerald-500" placeholder="you@example.com">
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Password</label>
        <input type="password" id="login-password" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-100 text-sm focus:outline-none focus:border-emerald-500" placeholder="••••••••">
      </div>
      <p id="login-error" class="text-xs text-rose-400 hidden"></p>
      <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold py-2.5 rounded-lg text-sm transition">Sign In</button>
    </form>
  </div>
</div>
</body>
</html>
